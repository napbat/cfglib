name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check repository policy
        run: python scripts/check_repository_policy.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with default features
        run: >-
          cargo clippy --workspace --all-targets --
          -D warnings -D clippy::pedantic

      - name: Run Clippy with all features
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings -D clippy::pedantic

      - name: Run Clippy on the allocation-counting benchmarks
        env:
          RUSTFLAGS: --cfg cfglib_bench_alloc
        run: >-
          cargo clippy -p cfglib --benches --all-features --
          -D warnings -D clippy::pedantic

      - name: Run tests with default features
        run: cargo test --workspace

      - name: Run tests with all features
        run: cargo test --workspace --all-features

      - name: Run examples
        run: cargo run -p cfglib --example control-tree

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read the MSRV from the workspace manifest
        id: msrv
        run: >-
          echo "version=$(cargo metadata --no-deps --format-version 1
          | jq -r '.packages[] | select(.name == "cfglib") | .rust_version')"
          >> "$GITHUB_OUTPUT"

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # rust-toolchain.toml selects stable for local work, and a toolchain
      # file outranks rustup's default, so name the MSRV toolchain explicitly.
      - name: Check with MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-targets --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Check no_std build with default features
        run: cargo check -p cfglib --target thumbv7em-none-eabi

      - name: Check no_std build with all features
        run: >-
          cargo check -p cfglib --all-features
          --target thumbv7em-none-eabi
