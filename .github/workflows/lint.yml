name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Two jobs run in parallel. `lint` holds every check that only compiles;
# `test` runs the suite once. The only feature, `serde`, is additive, so the
# all-features run tests every line of code. The default-features clippy step
# and the no_std checks keep the build without `serde` clean.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check repository policy
        run: python scripts/check_repository_policy.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with default features
        run: >-
          cargo clippy --workspace --all-targets --
          -D warnings -D clippy::pedantic

      - name: Run Clippy with all features
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings -D clippy::pedantic

      - name: Run Clippy on the allocation-counting benchmarks
        env:
          RUSTFLAGS: --cfg cfglib_bench_alloc
        run: >-
          cargo clippy -p cfglib --benches --all-features --
          -D warnings -D clippy::pedantic

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Check the no_std build
        run: |
          cargo check -p cfglib --target thumbv7em-none-eabi
          cargo check -p cfglib --all-features --target thumbv7em-none-eabi

      # rust-toolchain.toml selects stable for local work, and a toolchain
      # file outranks rustup's default, so name the MSRV toolchain explicitly.
      - name: Check with the MSRV
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cfglib") | .rust_version')"
          rustup toolchain install "$msrv" --profile minimal
          RUSTUP_TOOLCHAIN="$msrv" cargo check --workspace --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --workspace --all-features --doc

      - name: Run examples
        run: cargo run -p cfglib --example control-tree
