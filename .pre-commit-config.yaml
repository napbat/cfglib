# Single source of truth for local quality gates, served to both pre-commit
# and prek. Hygiene and fast gates run at commit time; the full test and doc
# suites run at push time. CI (.github/workflows/lint.yml) runs everything.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: repository-policy
        name: repository policy
        entry: python scripts/check_repository_policy.py
        language: python
        pass_filenames: false
        always_run: true
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings -D clippy::pedantic
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy-all-features
        name: cargo clippy (all features)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-nextest
        name: cargo nextest
        entry: cargo nextest run --workspace --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cargo-doctest
        name: cargo test (doctests)
        entry: cargo test --workspace --all-features --doc
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --workspace --all-features --no-deps
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
